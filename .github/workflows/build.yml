name: Build EXE

on: [push]

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/actions-python@v5
        with:
          python-version: '3.10'
      - name: Install PyInstaller
        run: pip install pyinstaller
      - name: Combine and Build EXE
        run: |
          # Lệnh gộp các file .py trừ main.py trên Windows (PowerShell)
          $files = Get-ChildItem -Filter *.py | Where-Object { $_.Name -ne 'main.py' } | Get-Content
          $files | Set-Content -Path full_code.py
          pyinstaller --onefile full_code.py
      - name: Upload EXE result
        uses: actions/upload-artifact@v4
        with:
          name: windows-exe
          path: dist/*.exe
